[package]
name = "zik-web"
version = "0.5.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
aws-config = "1.1"
aws-sdk-s3 = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }
