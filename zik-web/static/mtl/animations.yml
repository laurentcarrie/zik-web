items:
- name: move-the-line
  item: !Text
    text: Move The Line
    font: AkayaTelivigala-Regular
  embed_options:
    max_harmonics: 3000
    steps:
      ranges:
      - from: 1
        step: 3
        to: 20
        speed: 3.0
      - from: 20
        step: 20
        to: 100
        speed: 3.0
      - from: 100
        step: 1000
        to: 3200
        speed: 1.0
    show_contour: Never
    show_point: true
    show_trace: Always
    trace_length: 0.7
    opacity: 1.0
    show_nh: true
    trace_width: 0.4
    contour_width: 0.5
    show_fourier_circles: Always
    trace_colors:
    - white
    - cyan
    flip_y: false
- name: move-the-line-zapfino
  item: !Text
    text: Move The Line
    font: Zapfino
  embed_options:
    max_harmonics: 3000
    steps:
      ranges:
      - from: 1
        step: 10
        to: 3
        speed: 3.0
      - from: 10
        step: 30
        to: 200
        speed: 2.0
      - from: 200
        step: 200
        to: 10000
        speed: 2.0
    show_contour: !Congruence
      modulo: 5
      congruents:
      - 1
    show_point: true
    show_trace: !Congruence
      modulo: 10
      congruents:
      - 0
      - 1
      - 4
      - 5
      - 7
      - 9
    trace_length: 0.3
    opacity: 1.0
    show_nh: true
    trace_width: 0.4
    contour_width: 0.3
    show_fourier_circles: !Congruence
      modulo: 5
      congruents:
      - 0
    trace_colors:
    - white
    - blue
    - orange
    flip_y: false
- name: band
  item: !SvgPath
    path: band.svg
    flip_y: true
  embed_options:
    max_harmonics: 3000
    steps:
      ranges:
      - from: 1
        step: 3
        to: 10
        speed: 3.0
      - from: 10
        step: 20
        to: 50
        speed: 2.5
      - from: 50
        step: 50
        to: 500
        speed: 2.5
      - from: 500
        step: 500
        to: 5000
        speed: 2.5
    show_contour: !Congruence
      modulo: 10
      congruents:
      - 9
    show_point: true
    show_trace: Always
    trace_length: 680.0
    opacity: 1.0
    show_nh: true
    trace_width: 0.6
    contour_width: 0.5
    show_fourier_circles: !Congruence
      modulo: 5
      congruents:
      - 0
      - 1
      - 2
    trace_colors:
    - orange
    flip_y: false
