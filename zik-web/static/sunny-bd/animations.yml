items:
- name: sunny-bd
  item: !Text
    text: Sunny Bd
    font: AkayaTelivigala-Regular
  embed_options:
    max_harmonics: 3000
    steps:
      ranges:
      - from: 0
        step: 1
        to: 10
        speed: 2.0
      - from: 10
        step: 10
        to: 100
        speed: 2.0
      - from: 100
        step: 500
        to: 3000
        speed: 1.0
    show_contour: !Congruence
      modulo: 10
      congruents:
      - 9
    show_point: true
    show_trace: !Congruence
      modulo: 5
      congruents:
      - 0
      - 2
      - 4
    trace_length: 140.0
    opacity: 1.0
    show_nh: true
    trace_width: 1.4
    contour_width: 0.5
    show_fourier_circles: !Congruence
      modulo: 2
      congruents:
      - 0
    trace_colors:
    - black
    - blue
    flip_y: false
- name: sunny-bd-zapfino
