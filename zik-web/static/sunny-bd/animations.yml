      ranges:
      - from: 1
        step: 1
        to: 10
        speed: 3.0
      - from: 10
        step: 10
        to: 50
        speed: 2.5
      - from: 50
        step: 50
        to: 500
        speed: 2.5
      - from: 500
        step: 500
        to: 5000
