    show_contour: !Congruence
      modulo: 10
      congruents:
      - 9
    show_point: true
    show_trace: Always
    trace_length: 680.0
    opacity: 1.0
    show_nh: true
    trace_width: 0.6
    contour_width: 0.5
    show_fourier_circles: !Congruence
