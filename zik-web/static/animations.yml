items:
  - name: move-the-line
    item: !Text
      text: "Move The Line"
      font: "AkayaTelivigala-Regular"
    embed_options:
      speed: 3.0
      steps:
        thresholds:
          - start: 10
            step: 100
        max_harmonic: 1000
      show_contour: !OnceEvery
        modulo: 5
        remainders: [1]
      show_point: true
      show_trace: !Always
      trace_length: .3
      opacity: 1.0
      show_nh: true
      trace_width: 0.2
      contour_width: 0.3
      show_fourier_circles: !OnceEvery
        modulo: 2
        remainders: [0]
      trace_colors:
        - "white"
        - "red"
  - name: band
    item: !SvgPath
      path: band.svg
      flip_y: true
    embed_options:
      speed: 3.0
      steps:
        thresholds:
          - start: 10
            step: 100
        max_harmonic: 1000
      show_contour: !OnceEvery
        modulo: 3
        remainders: [1]
      show_point: true
      show_trace: !Always
      trace_length: .5
      opacity: 1.0
      show_nh: true
      trace_width: 0.1
      contour_width: .5
      show_fourier_circles: !OnceEvery
        modulo: 5
        remainders: [0,1,2]
      trace_colors:
        - "white"
