items:
- name: move-the-line
  item: !Text
    text: Move The Line
    font: AkayaTelivigala-Regular
  embed_options:
    num_points: 3000
    speed: 3.0
    steps:
      thresholds:
      - start: 10
        step: 100
      max_harmonic: 1000
    show_contour: Never
    show_point: true
    show_trace: Always
    trace_length: 830.0
    opacity: 1.0
    show_nh: true
    trace_width: 1.7
    contour_width: 0.3
    show_fourier_circles: !OnceEvery
      modulo: 2
      remainders:
      - 0
    trace_colors:
    - white
    - red
