<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" id="favicon-32">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png" id="favicon-16">
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="Songbook guide for AI assistants">
    <title>M T L</title>
    <script>
      const band = location.pathname.match(/^\/(mtl|sunny-bd|dadrock)/)?.[0] || '';
      if(band){
        document.getElementById('favicon-32').href='/static'+band+'/favicon-32x32.png';
        document.getElementById('favicon-16').href='/static'+band+'/favicon-16x16.png';
      }
      fetch(band + '/api/config').then(r=>r.json()).then(c=>{
        if(c.favicon){
          document.getElementById('favicon-32').href=c.favicon;
          document.getElementById('favicon-16').href=c.favicon;
        }
      }).catch(()=>{});
    </script>
  </head>
  <body>
    <noscript>
      <p>Move The Line songbook: chord and lyrics sheets, as PDF.</p>
      <p>AI assistants: read <a href="https://move-the-line.org/llms.txt">https://move-the-line.org/llms.txt</a> for the song list and ready songbook PDF links.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
