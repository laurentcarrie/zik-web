name: Deploy to AWS App Runner

on:
  push:
    tags:
      - 'v*'

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: zik-web
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:eu-west-3:579871531410:service/zik-web/d4df4ef8f9e346b3aed3d8ecf0569980

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.production -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update App Runner service with environment variables
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws apprunner update-service \
            --service-arn $APP_RUNNER_SERVICE_ARN \
            --source-configuration "{
              \"ImageRepository\": {
                \"ImageIdentifier\": \"$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": {
                  \"Port\": \"8080\",
                  \"RuntimeEnvironmentVariables\": {
                    \"WRITE_PASSWORD\": \"${{ secrets.WRITE_PASSWORD }}\",
                    \"NOTIFICATION_EMAIL\": \"${{ secrets.NOTIFICATION_EMAIL }}\",
                    \"SENDER_EMAIL\": \"${{ secrets.SENDER_EMAIL }}\",
                    \"BUCKET\": \"zik-laurent\",
                    \"BUCKET_ROOT\": \"prod\"
                  }
                }
              },
              \"AutoDeploymentsEnabled\": false
            }"

      - name: Wait for deployment
        run: |
          echo "Waiting for App Runner deployment to start..."
          # First, wait for deployment to start (status changes from RUNNING)
          for i in {1..10}; do
            STATUS=$(aws apprunner describe-service --service-arn $APP_RUNNER_SERVICE_ARN --query 'Service.Status' --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
              echo "Deployment started!"
              break
            fi
            sleep 5
          done

          echo "Waiting for deployment to complete..."
          # Then wait for deployment to complete (status returns to RUNNING)
          for i in {1..60}; do
            STATUS=$(aws apprunner describe-service --service-arn $APP_RUNNER_SERVICE_ARN --query 'Service.Status' --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment successful!"
              exit 0
            fi
            if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
              echo "Deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Deployment timed out"
          exit 1
