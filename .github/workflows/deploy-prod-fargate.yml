name: Deploy Prod to Fargate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'zik-web/Cargo.toml'

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: zik-web
  ECS_CLUSTER: zik-web-prod
  ECS_SERVICE: zik-web-prod
  CONTAINER_NAME: zik-web

jobs:
  # Same gate as deploy-prod.yml: a push to main only deploys when the crate
  # version actually changed, so unrelated Cargo.toml edits are no-ops. The
  # version tag is created by deploy-prod.yml alone -- tagging here too would
  # fail on the second workflow to run.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURRENT=$(grep '^version' zik-web/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          PREVIOUS=$(git show HEAD~1:zik-web/Cargo.toml | grep '^version' | head -1 | sed 's/version = "\(.*\)"/\1/' || echo "")
          echo "Current version: $CURRENT, Previous version: $PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-prod-fargate:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition zik-web-prod \
            --query 'taskDefinition' \
            --output json > task-definition.json

      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
