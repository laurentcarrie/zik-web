AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Infrastructure for zik-web (move-the-line.org).
  S3, ECR, Lambda, App Runner, CloudFront, Route 53, IAM.

Parameters:
  WritePassword:
    Type: String
    NoEcho: true
    Description: Password for write operations in the zik-web application.
  NotificationEmail:
    Type: String
    NoEcho: true
    Description: Email address for build notifications.
  SenderEmail:
    Type: String
    NoEcho: true
    Description: Email address used as SES sender.

Resources:
  # ---------------------------------------------------------------------------
  # S3
  # ---------------------------------------------------------------------------
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: zik-laurent

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${S3Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ---------------------------------------------------------------------------
  # ECR Repositories
  # ---------------------------------------------------------------------------
  ZikWebECR:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: zik-web

  BandSongbookLambdaECR:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: band-songbook-lambda

  SongbookProcessorECR:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: songbook-processor

  # ---------------------------------------------------------------------------
  # IAM — Lambda Execution Role
  # ---------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: band-songbook-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${S3Bucket.Arn}/songs/*"
                  - !GetAtt S3Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${S3Bucket.Arn}/delivery/*"
                  - !Sub "${S3Bucket.Arn}/sandbox/*"

  # ---------------------------------------------------------------------------
  # IAM — App Runner ECR Access Role
  # ---------------------------------------------------------------------------
  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: apprunner-ecr-access-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # ---------------------------------------------------------------------------
  # IAM — App Runner Instance Role
  # ---------------------------------------------------------------------------
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: apprunner-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppRunnerInstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt S3Bucket.Arn
                  - !Sub "${S3Bucket.Arn}/*"
              - Sid: LambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt BandSongbookFunction.Arn
              - Sid: CloudWatchLogsRead
                Effect: Allow
                Action:
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt LambdaLogGroup.Arn
              - Sid: SESSendEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"

  # ---------------------------------------------------------------------------
  # CloudWatch Log Group
  # ---------------------------------------------------------------------------
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/band-songbook

  # ---------------------------------------------------------------------------
  # Lambda
  # ---------------------------------------------------------------------------
  BandSongbookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: band-songbook
      PackageType: Image
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/band-songbook-lambda:latest"
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 10240
      Environment:
        Variables:
          RUST_LOG: info
      LoggingConfig:
        LogGroup: !Ref LambdaLogGroup

  # ---------------------------------------------------------------------------
  # App Runner
  # ---------------------------------------------------------------------------
  ZikWebService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: zik-web
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/zik-web:latest"
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: WRITE_PASSWORD
                Value: !Ref WritePassword
              - Name: NOTIFICATION_EMAIL
                Value: !Ref NotificationEmail
              - Name: SENDER_EMAIL
                Value: !Ref SenderEmail
      InstanceConfiguration:
        Cpu: "1024"
        Memory: "2048"
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: TCP
        Interval: 5
        Timeout: 2
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true

  # ---------------------------------------------------------------------------
  # CloudFront
  # ---------------------------------------------------------------------------
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: zik-laurent-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${S3Bucket}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: allow-all
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          DefaultTTL: 86400
          ForwardedValues:
            QueryString: false

  # ---------------------------------------------------------------------------
  # Route 53
  # ---------------------------------------------------------------------------
  DNSRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z07554092VOHCSY042QTP
      Name: move-the-line.org.
      Type: A
      AliasTarget:
        DNSName: !GetAtt ZikWebService.ServiceUrl
        HostedZoneId: Z087117439MBKHYM69QS6  # App Runner hosted zone for eu-west-3

  DNSRecordWWW:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z07554092VOHCSY042QTP
      Name: www.move-the-line.org.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !GetAtt ZikWebService.ServiceUrl

Outputs:
  S3BucketName:
    Value: !Ref S3Bucket
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  AppRunnerServiceUrl:
    Value: !GetAtt ZikWebService.ServiceUrl
  LambdaFunctionArn:
    Value: !GetAtt BandSongbookFunction.Arn
