[package]
name = "rust-hello"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
aws-config = "1.1"
aws-sdk-s3 = "1.15"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
